services:
  big-brother:
    build: .
    ports:
      - "127.0.0.1:8787:8787" # localhost-only on the host (the panel has no auth)
    env_file:
      - path: ./.env
        required: false
    volumes:
      - ./docker/config.toml:/app/config/config.toml:ro
      - big-brother-data:/app/data # persisted chat settings (panel edits)
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8787/health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks: [proxy, metrics]

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    ports:
      # Defaults to localhost. Set WEBUI_BIND_ADDR=0.0.0.0 in .env to reach it
      # from the LAN -- Open WebUI has its own login, unlike the proxy panel.
      - "${WEBUI_BIND_ADDR:-127.0.0.1}:3000:8080"
    environment:
      # Open WebUI talks OpenAI dialect to Big Brother, which routes it
      # through the cascade pipeline (or passes through to LM Studio -- see
      # the Chat card on the panel at http://localhost:8787/panel).
      OPENAI_API_BASE_URL: "http://big-brother:8787/v1"
      OPENAI_API_KEY: "big-brother"
    volumes:
      - open-webui-data:/app/backend/data
    restart: unless-stopped
    networks: [webui, proxy]

  docexport:
    build: ./docexport
    ports:
      # Published because the *browser* follows the download link directly;
      # container-to-container calls use http://docexport:8000 instead. If you
      # expose Open WebUI to the LAN, this has to follow or downloads 404 for
      # every client that isn't the Docker host.
      - "${DOCEXPORT_BIND_ADDR:-127.0.0.1}:8789:8000"
    environment:
      RETENTION_SECONDS: "${DOCEXPORT_RETENTION_SECONDS:-3600}"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks: [webui] # only Open WebUI needs to reach it

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks: [metrics, grafana]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "127.0.0.1:3001:3000" # 3000 is taken by open-webui on the host
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks: [grafana] # reaches ONLY prometheus — never the proxy or open-webui
    restart: unless-stopped

networks:
  proxy: {}
  webui: {}
  metrics: {}
  grafana: {}

volumes:
  big-brother-data:
  open-webui-data:
  prometheus-data:
  grafana-data:
