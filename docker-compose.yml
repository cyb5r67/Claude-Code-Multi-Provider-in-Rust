services:
  big-brother:
    build: .
    ports:
      - "127.0.0.1:8787:8787" # localhost-only on the host (the panel has no auth)
    env_file:
      - path: ./.env
        required: false
    volumes:
      - ./docker/config.toml:/app/config/config.toml:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8787/health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks: [proxy, metrics]

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    ports:
      - "127.0.0.1:3000:8080"
    environment:
      # Open WebUI speaks the OpenAI dialect straight to LM Studio -- it does
      # not go through Big Brother (which speaks the Anthropic dialect).
      OPENAI_API_BASE_URL: "${LMSTUDIO_HOST:-http://192.168.1.10:8088}/v1"
      OPENAI_API_KEY: "lm-studio"
    volumes:
      - open-webui-data:/app/backend/data
    restart: unless-stopped
    networks: [webui]

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks: [metrics, grafana]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "127.0.0.1:3001:3000" # 3000 is taken by open-webui on the host
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks: [grafana] # reaches ONLY prometheus — never the proxy or open-webui
    restart: unless-stopped

networks:
  proxy: {}
  webui: {}
  metrics: {}
  grafana: {}

volumes:
  open-webui-data:
  prometheus-data:
  grafana-data:
